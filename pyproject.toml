[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astra-blender-harness"
version = "0.2.0"
description = "A local, model-agnostic Blender MCP studio with visual feedback and bounded agent runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alejandro Brito"}]
dependencies = ["mcp>=1.26,<2", "litellm>=1.81,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jsonschema>=4.23,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
# Optional: lets Astra remember an API key in the OS keyring instead of asking
# for it every session. Without it, profiles still save everything but the key.
keyring = ["keyring>=25,<26"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1,<2", "keyring>=25,<26"]

[project.scripts]
astra-blender = "astra_blender.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_blender"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
